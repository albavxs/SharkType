name: Generate free track catalog

on:
  push:
    branches: [dev]
    paths:
      - 'scripts/generate-free-track-catalog.mjs'
      - 'data/tracks.ts'
      - 'data/manifest.ts'
      - 'data/c.ts'
      - 'data/csharp.ts'
      - 'data/index.ts'
      - 'data/public-snippet-counts.ts'
      - 'data/generated/free-track-snippets.ts'
      - 'lib/server/track-store.ts'
      - 'app/tracks/page.tsx'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.track-catalog.json'
      - '.github/workflows/generate-free-track-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate public free track catalog
        run: node scripts/generate-free-track-catalog.mjs

      - name: Validate generated diff
        run: git diff --check

      - name: Typecheck track runtime
        run: npx tsc -p tsconfig.track-catalog.json --pretty false

      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/free-track-snippets.ts
          if git diff --cached --quiet; then
            echo "Free track catalog already up to date."
          else
            git commit -m "chore: regenerate free track catalog"
            git push origin HEAD:dev
          fi
