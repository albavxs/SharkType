name: Validate pull request

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate diff
        run: git diff --check origin/master...HEAD

      - name: Typecheck track and Mastery runtime
        run: npx tsc -p tsconfig.track-catalog.json --pretty false

      - name: Typecheck billing runtime
        run: npx tsc -p tsconfig.billing.json --pretty false

      - name: Generate Next.js types
        run: npx next typegen

      - name: Typecheck app
        run: npx tsc --noEmit --pretty false

      - name: Validate content policies
        run: |
          npm run check:pt-content
          npm run check:access-policies

      - name: Lint changed source files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/master...HEAD | grep -E '\.(ts|tsx|js|jsx|mjs|cjs)$' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No changed source files to lint."
            exit 0
          fi
          npx eslint "${files[@]}"
